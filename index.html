<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title></title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <p><strong id="app-name"></strong> <span id="app-tagline"></span></p>
    <div class="project-tools">
      <button type="button" id="undo-btn" disabled>Undo</button>
      <button type="button" id="redo-btn" disabled>Redo</button>
      <button type="button" id="export-btn">Save project file</button>
      <button type="button" id="import-btn">Open project file</button>
      <input type="file" id="import-file" accept=".json,application/json" hidden>
      <button type="button" id="reset-btn">Start over</button>
    </div>
    <p class="error" id="project-error" hidden></p>
  </header>
  <div class="builder">
    <main id="wizard"></main>
    <aside class="preview" aria-label="Live preview">
      <div class="preview-bar"><span class="preview-label">Preview</span><div id="preview-devices"></div></div>
      <div id="preview-stage"><iframe id="preview-frame" title="Live preview of your site" sandbox="allow-same-origin"></iframe></div>
    </aside>
  </div>
  <footer id="app-footer"></footer>
  <script src="js/utils.js"></script>
  <script>
    // Fill the app name from utils.js, so it is written in one place only
    document.title = APP_NAME + " - " + APP_TAGLINE;
    document.getElementById("app-name").textContent = APP_NAME;
    document.getElementById("app-tagline").textContent = APP_TAGLINE;
    document.getElementById("app-footer").textContent = APP_NAME + ". Works offline.";
  </script>
  <script src="js/themes.js"></script>
  <script src="js/layouts.js"></script>
  <script src="js/templates.js"></script>
  <script src="js/steps.js"></script>
  <script src="js/gallery.js"></script>
  <script src="js/preview.js"></script>
  <script src="js/lib/jszip.min.js"></script>
  <script src="js/export.js"></script>
  <script src="js/history.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
